# Render Blueprint: one paid web service runs both the website and the API
# (see start-all.mjs). The website answers on Render's PORT and forwards
# /api/... to the API on localhost:4000. The disk keeps enquiries and news
# between restarts, and the paid plan means the service never sleeps.
services:
  - type: web
    name: tehillah-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node start-all.mjs
    healthCheckPath: /api/health
    disk:
      name: tehillah-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_FILE
        value: /var/data/db.json
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      # Where the website finds the API. Both run on the same server.
      - key: API_URL
        value: http://localhost:4000
      # The public address of the website (used for the sitemap and sharing links)
      - key: NEXT_PUBLIC_SITE_URL
        value: https://tehillah-api.onrender.com
