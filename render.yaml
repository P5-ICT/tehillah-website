# Render Blueprint: creates the API and the website as two web services.
# The API is on a paid plan with a disk, so it stays awake and keeps enquiries
# and news between restarts. The website is free and sleeps after ~15 minutes
# without visitors.
services:
  - type: web
    name: tehillah-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build -w backend
    startCommand: npm run start -w backend
    healthCheckPath: /api/health
    disk:
      name: tehillah-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_FILE
        value: /var/data/db.json
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TRUST_PROXY
        value: "1"

  - type: web
    name: tehillah-web
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w frontend
    startCommand: npm exec -w frontend -- next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The API's public address, e.g. https://tehillah-api.onrender.com
      # It is saved into the build, so redeploy the website after changing it.
      - key: API_URL
        sync: false
      # The website's public address, e.g. https://tehillah-web.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
